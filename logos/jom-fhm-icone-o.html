<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Icône JOM FHM : le O sur pastille</title>
<style>
html,body{margin:0;width:1600px;height:700px;font-family:Helvetica,Arial,sans-serif}
.grid{display:grid;grid-template-columns:1fr 1fr;height:700px}
.panel{display:flex;flex-direction:column;justify-content:center}
.light{background:#ffffff;color:#1c1916}
.dark{background:#141210;color:#f4efe8}
.row{display:flex;align-items:center;gap:34px;height:300px;padding-left:70px;position:relative}
.lab{position:absolute;left:70px;top:18px;font-size:16px;letter-spacing:.03em;opacity:.55}
svg{display:block;flex:none}
</style></head><body>
<div class="grid"><div class="panel light" id="L"></div><div class="panel dark" id="D"></div></div>
<script>
const G="Georgia,'Times New Roman',serif";
// tile : fond de la pastille ; o : framboise adaptée au fond ; edge : liseré si la pastille a la couleur du fond de page
const tile=(bg,o,edge)=>`<rect x="2" y="2" width="96" height="96" rx="22" fill="${bg}"${edge?` stroke="${edge}" stroke-width="2"`:''}/><text x="50" y="50.5" text-anchor="middle" dominant-baseline="central" font-family="${G}" font-weight="700" font-size="84" fill="${o}">O</text>`;
const rows={
  L:[{lab:"Pastille noire, O framboise",svg:tile("#141210","#d0587f")},
     {lab:"Pastille blanche, O framboise (liseré sur fond blanc)",svg:tile("#ffffff","#b03a63","#e4ddd6")}],
  D:[{lab:"Pastille noire, O framboise (liseré sur fond noir)",svg:tile("#141210","#d0587f","#3a3530")},
     {lab:"Pastille blanche, O framboise",svg:tile("#ffffff","#b03a63")}]
};
const sizes=[200,104,56,32,16];
for(const id of ["L","D"]){
  const p=document.getElementById(id);
  for(const r of rows[id]){
    const d=document.createElement("div");d.className="row";
    d.innerHTML=`<div class="lab">${r.lab}</div>`+sizes.map(s=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100">${r.svg}</svg>`).join("");
    p.appendChild(d);
  }
}
</script>
</body></html>
