<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>JOM FHM classique</title>
<style>
html,body{margin:0;width:1600px;height:1000px;font-family:Helvetica,Arial,sans-serif}
.row{display:grid;grid-template-columns:1fr 1fr;height:500px}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.sep{border-left:1px solid rgba(128,128,128,.25)}
.dark{background:#141210;color:#f4efe8;--f:#d0587f;--sub:#b9b0a5}
.light{background:#faf7f2;color:#1c1916;--f:#b03a63;--sub:#6f665c}
.lab{position:absolute;bottom:26px;font-size:18px;letter-spacing:.03em;opacity:.5}
.jom{font-family:Georgia,'Times New Roman',serif;font-size:150px;font-weight:700;letter-spacing:.04em;line-height:1;white-space:nowrap}
.ow{position:relative;display:inline-block}
.ow svg{position:absolute;left:calc(50% - .02em);top:51.5%;width:.22em;height:.22em;transform:translate(-50%,-50%)}
.so{height:.72em;width:.72em;vertical-align:-.01em;margin:0 .02em;overflow:visible}
.fhm{font-size:30px;font-weight:300;letter-spacing:.9em;margin:14px 0 0 .9em}
.rule{width:200px;height:2px;background:var(--f);margin:26px 0 18px}
.sig{font-family:Georgia,serif;font-style:italic;font-size:24px;color:var(--sub)}
</style></head><body>
<div class="row dark">
  <div class="cell"><div class="jom">J<span class="ow">O<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.6" fill="none" stroke="var(--f)" stroke-width="3.2"/></svg></span>M</div><div class="fhm">FHM</div><div class="rule"></div><div class="sig">les liens du sang</div><div class="lab">1 · Le O de la police, un cercle framboise dedans</div></div>
  <div class="cell sep"><div class="jom">J<svg class="so" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="6"/><circle cx="20" cy="20" r="8.2" fill="none" stroke="var(--f)" stroke-width="3.6"/></svg>M</div><div class="fhm">FHM</div><div class="rule"></div><div class="sig">les liens du sang</div><div class="lab">2 · Les deux cercles dessinés</div></div>
</div>
<div class="row light">
  <div class="cell"><div class="jom">J<span class="ow">O<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.6" fill="none" stroke="var(--f)" stroke-width="3.2"/></svg></span>M</div><div class="fhm">FHM</div><div class="rule"></div><div class="sig">les liens du sang</div><div class="lab">1 · Le O de la police, un cercle framboise dedans</div></div>
  <div class="cell sep"><div class="jom">J<svg class="so" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="6"/><circle cx="20" cy="20" r="8.2" fill="none" stroke="var(--f)" stroke-width="3.6"/></svg>M</div><div class="fhm">FHM</div><div class="rule"></div><div class="sig">les liens du sang</div><div class="lab">2 · Les deux cercles dessinés</div></div>
</div>
</body></html>
