<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Logos Timops</title>
<style>
html,body{margin:0;width:2400px;height:900px;font-family:Helvetica,Arial,sans-serif}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;height:450px}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.dark{background:#111214;color:#fff}
.light{background:#fff;color:#111214}
.logo{font-size:150px;font-weight:500;line-height:1;white-space:nowrap}
.logo.bold{font-weight:700;letter-spacing:-.01em}
.o{height:0.76em;width:0.76em;vertical-align:-0.022em;margin:0 0.04em;overflow:visible}
.bold .o{height:0.66em;width:0.66em;vertical-align:-0.04em;margin:0 0.04em}
.lab{font-size:22px;letter-spacing:.02em;opacity:.55}
.sep{border-left:1px solid rgba(128,128,128,.25)}
</style></head><body>
<div class="row dark">
  <div class="cell"><div class="logo">Tim<svg class="o" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17.3" fill="none" stroke="#fff" stroke-width="5.4"/><circle cx="20" cy="20" r="5" fill="#3B82F6"/></svg>ps</div><div class="lab">Point bleu au centre</div></div>
  <div class="cell sep"><div class="logo">Tim<svg class="o" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17.3" fill="none" stroke="#fff" stroke-width="5.4"/><circle cx="32.2" cy="7.8" r="7.4" fill="#111214"/><circle cx="32.2" cy="7.8" r="5.2" fill="#3B82F6"/></svg>ps</div><div class="lab">Variante 2 : point découpé sur le cercle</div></div>
  <div class="cell sep"><div class="logo bold">tim<svg class="o" viewBox="0 0 40 40"><g fill="#3B82F6" transform="rotate(90 20 20)"><path d="M6.48 16.38 A14 14 0 0 1 30.72 11" fill="none" stroke="#3B82F6" stroke-width="6"/><path d="M34.58 15.6 L35.32 7.14 L26.12 14.86 Z"/><path d="M33.52 23.62 A14 14 0 0 1 9.28 29" fill="none" stroke="#3B82F6" stroke-width="6"/><path d="M5.42 24.4 L4.68 32.86 L13.88 25.14 Z"/></g></svg>ps</div><div class="lab">Variante 3 : minuscules, deux flèches bleues qui tournent</div></div>
</div>
<div class="row light">
  <div class="cell"><div class="logo">Tim<svg class="o" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17.3" fill="none" stroke="#111214" stroke-width="5.4"/><circle cx="20" cy="20" r="5" fill="#2563EB"/></svg>ps</div><div class="lab">Point bleu au centre</div></div>
  <div class="cell sep"><div class="logo">Tim<svg class="o" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17.3" fill="none" stroke="#111214" stroke-width="5.4"/><circle cx="32.2" cy="7.8" r="7.4" fill="#fff"/><circle cx="32.2" cy="7.8" r="5.2" fill="#2563EB"/></svg>ps</div><div class="lab">Variante 2 : point découpé sur le cercle</div></div>
  <div class="cell sep"><div class="logo bold">tim<svg class="o" viewBox="0 0 40 40"><g fill="#2563EB" transform="rotate(90 20 20)"><path d="M6.48 16.38 A14 14 0 0 1 30.72 11" fill="none" stroke="#2563EB" stroke-width="6"/><path d="M34.58 15.6 L35.32 7.14 L26.12 14.86 Z"/><path d="M33.52 23.62 A14 14 0 0 1 9.28 29" fill="none" stroke="#2563EB" stroke-width="6"/><path d="M5.42 24.4 L4.68 32.86 L13.88 25.14 Z"/></g></svg>ps</div><div class="lab">Variante 3 : minuscules, deux flèches bleues qui tournent</div></div>
</div>
</body></html>
