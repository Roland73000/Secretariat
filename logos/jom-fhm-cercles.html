<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>JOM FHM, les cercles</title>
<style>
html,body{margin:0;width:1800px;height:1000px;font-family:Helvetica,Arial,sans-serif}
.row{display:grid;grid-template-columns:repeat(3,1fr);height:500px}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.sep{border-left:1px solid rgba(128,128,128,.25)}
.dark{background:#141210;color:#f4efe8}
.light{background:#faf7f2;color:#1c1916}
.dark .r1{--f:#d98a9b}.dark .r2{--f:#e8b4bc}.dark .r3{--f:#d0587f}
.light .r1{--f:#b4647a}.light .r2{--f:#c98492}.light .r3{--f:#b03a63}
.lab{position:absolute;bottom:26px;font-size:18px;letter-spacing:.03em;opacity:.5}
.jom{font-size:150px;font-weight:700;line-height:1;white-space:nowrap;letter-spacing:.02em}
.o{height:.76em;width:.76em;vertical-align:-.022em;margin:0 .03em;overflow:visible}
.fhm{font-size:28px;font-weight:500;letter-spacing:.85em;margin:20px 0 0 .85em}
.sig{font-size:17px;letter-spacing:.32em;text-transform:uppercase;color:var(--f);margin-top:22px;font-weight:600}
</style></head><body>
<div class="row dark">
  <div class="cell r1"><div class="jom">J<svg class="o" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17.4" fill="none" stroke="currentColor" stroke-width="5.2"/><circle cx="20" cy="20" r="8.6" fill="none" stroke="var(--f)" stroke-width="4"/></svg>M</div><div class="fhm">FHM</div><div class="sig">Les liens du sang</div><div class="lab">Vieux rose</div></div>
  <div class="cell sep r2"><div class="jom">J<svg class="o" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17.4" fill="none" stroke="currentColor" stroke-width="5.2"/><circle cx="20" cy="20" r="8.6" fill="none" stroke="var(--f)" stroke-width="4"/></svg>M</div><div class="fhm">FHM</div><div class="sig">Les liens du sang</div><div class="lab">Rose poudré</div></div>
  <div class="cell sep r3"><div class="jom">J<svg class="o" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17.4" fill="none" stroke="currentColor" stroke-width="5.2"/><circle cx="20" cy="20" r="8.6" fill="none" stroke="var(--f)" stroke-width="4"/></svg>M</div><div class="fhm">FHM</div><div class="sig">Les liens du sang</div><div class="lab">Framboise</div></div>
</div>
<div class="row light">
  <div class="cell r1"><div class="jom">J<svg class="o" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17.4" fill="none" stroke="currentColor" stroke-width="5.2"/><circle cx="20" cy="20" r="8.6" fill="none" stroke="var(--f)" stroke-width="4"/></svg>M</div><div class="fhm">FHM</div><div class="sig">Les liens du sang</div><div class="lab">Vieux rose</div></div>
  <div class="cell sep r2"><div class="jom">J<svg class="o" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17.4" fill="none" stroke="currentColor" stroke-width="5.2"/><circle cx="20" cy="20" r="8.6" fill="none" stroke="var(--f)" stroke-width="4"/></svg>M</div><div class="fhm">FHM</div><div class="sig">Les liens du sang</div><div class="lab">Rose poudré</div></div>
  <div class="cell sep r3"><div class="jom">J<svg class="o" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17.4" fill="none" stroke="currentColor" stroke-width="5.2"/><circle cx="20" cy="20" r="8.6" fill="none" stroke="var(--f)" stroke-width="4"/></svg>M</div><div class="fhm">FHM</div><div class="sig">Les liens du sang</div><div class="lab">Framboise</div></div>
</div>
</body></html>
